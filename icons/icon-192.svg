<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121216"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="auraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B2CBF"/>
      <stop offset="50%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="url(#bgGrad)" stroke="#1a1a24" stroke-width="2"/>
  
  <!-- Outer Glow Circle -->
  <circle cx="96" cy="96" r="70" fill="none" stroke="url(#auraGrad)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />
  
  <!-- Stylized "A" Aura Logo -->
  <g filter="url(#glow)">
    <!-- Back wing -->
    <path d="M 66 136 L 96 56 L 108 88" fill="none" stroke="#7B2CBF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <!-- Main wing -->
    <path d="M 76 136 L 96 56 L 126 136" fill="none" stroke="url(#auraGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Horizontal bar -->
    <path d="M 83 112 L 109 112" fill="none" stroke="#00F5D4" stroke-width="5" stroke-linecap="round"/>
    <!-- Inner glowing dot -->
    <circle cx="96" cy="94" r="5" fill="#FFFFFF" />
  </g>
</svg>
