<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121216"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="auraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B2CBF"/>
      <stop offset="50%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#1a1a24" stroke-width="4"/>
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#auraGrad)" stroke-width="3" stroke-dasharray="20 15" opacity="0.4" />
  
  <!-- Stylized "A" Aura Logo -->
  <g filter="url(#glow)">
    <!-- Back wing -->
    <path d="M 176 360 L 256 150 L 288 230" fill="none" stroke="#7B2CBF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <!-- Main wing -->
    <path d="M 200 360 L 256 150 L 336 360" fill="none" stroke="url(#auraGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Horizontal bar -->
    <path d="M 218 296 L 292 296" fill="none" stroke="#00F5D4" stroke-width="12" stroke-linecap="round"/>
    <!-- Inner glowing dot -->
    <circle cx="256" cy="245" r="12" fill="#FFFFFF" />
  </g>
</svg>
